# Пример конфигурации LoRa-Bridge — минимальный набор полей для запуска.
# Скопируйте в config.yaml и замените под своё устройство и бота.
#
# Секреты можно писать как есть или через ${ENV_VAR} — обе формы работают.
# Полный справочник всех полей (private/room_server-каналы, rate-limit,
# команды бота и т.д.) — docs/config/index.md.
# Как найти device_id/port/host/address под своё устройство — docs/install/meshcore.md.

lora:
  - id: meshcore-1
    connection:
      # usb | serial | tcp | ble — см. docs/install/meshcore.md
      type: usb
      device_id: "0403:6015" # VID:PID устройства, из lsusb / Device Manager
    endpoints:
      general:
        type: public # публичный канал MeshCore, без секрета
        channel_name: "General" # имя канала из вкладки Channels в MeshCore
    policies:
      egress_rate:
        msgs_per_window: 6
        window_seconds: 60

messengers:
  - id: telegram-main
    kind: telegram
    token: ${TG_BOT_TOKEN} # token от @BotFather

rooms:
  - lora:
      node: meshcore-1
      endpoint: general
    subscribers:
      - transport: telegram-main
        chat: "-1001234567890" # chat_id чата, см. docs/install/telegram.md
